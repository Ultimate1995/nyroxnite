<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Seite nicht erreichbar</title><link rel="stylesheet" href="common.css">
<style>body { display: grid; place-items: center; min-height: 100vh; } .box { max-width: 520px; text-align: center; padding: 30px; }
.big { font-size: 64px; } code { color: var(--muted); font-size: 12.5px; }</style></head>
<body><div class="box">
  <div class="big">🛰️</div>
  <h1 style="justify-content:center">Seite nicht erreichbar</h1>
  <p class="muted" id="msg"></p>
  <p><code id="code"></code></p>
  <div class="toolbar" style="justify-content:center"><button class="primary" id="retry">Erneut versuchen</button></div>
</div>
<script src="common.js"></script>
<script>
const p = new URLSearchParams(location.search);
const url = p.get('url') || '';
const code = parseInt(p.get('code'), 10);
const MSG = {
  '-105': 'Die Adresse wurde nicht gefunden. Prüfe, ob sie richtig geschrieben ist.',
  '-106': 'Keine Internetverbindung.',
  '-102': 'Die Verbindung wurde abgelehnt.',
  '-118': 'Die Seite hat zu lange nicht geantwortet.',
  '-137': 'Die Adresse wurde nicht gefunden.',
  '-200': 'Das Sicherheitszertifikat der Seite ist ungültig.',
  '-201': 'Das Sicherheitszertifikat der Seite ist abgelaufen.',
  '-202': 'Dem Sicherheitszertifikat der Seite wird nicht vertraut.',
};
document.title = hostOf(url) || 'Fehler';
$('#msg').textContent = (MSG[String(code)] || 'Die Seite konnte nicht geladen werden.') + (url ? ' (' + hostOf(url) + ')' : '');
$('#code').textContent = (p.get('desc') || '') + (code ? ' · ' + code : '');
$('#retry').onclick = () => { if (url) location.href = url; };
if (window.nyrox) boot(() => {});
</script></body></html>
